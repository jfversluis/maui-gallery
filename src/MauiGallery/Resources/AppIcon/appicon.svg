<?xml version="1.0" encoding="UTF-8"?>
<!-- App icon background: the BrushHero gradient (purple to blue) with a soft highlight. -->
<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="456" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B2FD9" />
      <stop offset="0.55" stop-color="#4F46E5" />
      <stop offset="1" stop-color="#2563EB" />
    </linearGradient>
    <radialGradient id="glow" cx="110" cy="90" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="456" height="456" fill="url(#brand)" />
  <rect width="456" height="456" fill="url(#glow)" />
</svg>
