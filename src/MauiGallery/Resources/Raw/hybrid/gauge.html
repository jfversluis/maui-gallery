<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gauge</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="hybrid.css">
  <style>
    body { display: flex; align-items: center; gap: 20px; }
    .gauge {
      --level: 0;
      width: 120px;
      height: 120px;
      flex: none;
      border-radius: 50%;
      background: conic-gradient(var(--accent) calc(var(--level) * 1%), var(--surface) 0);
      display: grid;
      place-items: center;
      transition: background 0.2s;
    }
    .gauge span {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--background);
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: 600;
    }
  </style>
  <script src="_framework/hybridwebview.js"></script>
  <script src="gauge.js" defer></script>
</head>
<body>
  <div class="gauge" id="gauge"><span id="value">0%</span></div>
  <div>
    <h1 id="label">Low</h1>
    <p>.NET calls setLevel(level) in this page.</p>
  </div>
</body>
</html>
