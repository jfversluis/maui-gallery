name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  APP_PROJECT: src/MauiGallery/MauiGallery.csproj

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet test tests/MauiGallery.Core.Tests --configuration Release

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'
      - run: dotnet workload install maui-android
      - run: dotnet build ${{ env.APP_PROJECT }} -f net11.0-android --configuration Release

  apple:
    name: ${{ matrix.tfm }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        tfm: [net11.0-ios, net11.0-maccatalyst]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Select the newest Xcode
        run: sudo xcode-select --switch "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - run: dotnet workload install maui
      - run: dotnet build ${{ env.APP_PROJECT }} -f ${{ matrix.tfm }} --configuration Release

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet workload install maui
      - run: dotnet build ${{ env.APP_PROJECT }} -f net11.0-windows10.0.19041.0 --configuration Release
