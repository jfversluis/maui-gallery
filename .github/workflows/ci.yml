name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  APP_PROJECT: src/MauiGallery/MauiGallery.csproj
  XCODE_VERSION: '27.2'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet test tests/MauiGallery.Core.Tests --configuration Release

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'
      - run: dotnet workload install maui-android
      # The Map sample's Google Maps key comes from a secret, never from the repo. MSBuild reads the MapsApiKey
      # environment variable as a property; without the secret it's empty and the page explains what's missing.
      - run: dotnet build ${{ env.APP_PROJECT }} -f net11.0-android --configuration Release
        env:
          MapsApiKey: ${{ secrets.MAPS_API_KEY }}

  apple:
    name: ${{ matrix.tfm }}
    # .NET 11 for iOS/Mac Catalyst requires Xcode 27.2, available on the xcode-27 image.
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        tfm: [net11.0-ios, net11.0-maccatalyst]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app
      - run: dotnet workload install maui
      - run: dotnet build ${{ env.APP_PROJECT }} -f ${{ matrix.tfm }} --configuration Release

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet workload install maui
      # The Map sample's Azure Maps key, like the Google Maps key above: from a secret, empty without it.
      - run: dotnet build ${{ env.APP_PROJECT }} -f net11.0-windows10.0.19041.0 --configuration Release
        env:
          AzureMapsKey: ${{ secrets.AZURE_MAPS_KEY }}
