name: Windows UI

# Builds the Debug Windows app (unpackaged, with the DevFlow agent), crawls every catalog page with the maui CLI in
# light and dark at compact, medium and expanded widths, and uploads the screenshots, logs and diagnostics.
# With mode "platform-shots" (or a push whose commit message contains [platform-shots]) it captures the
# "Same code, every platform" images instead (see eng/platform-shots) and uploads them normalized, ready to commit.
# A second job publishes the Release MSIX like release.yml does and checks that the Release build starts.
# Runs on GitHub-hosted windows-latest by default. To use a self-hosted machine (see docs/windows-validation.md),
# pick its label in the run dialog or set the WINDOWS_UI_RUNNER repository variable to it, e.g. windows-ui.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (windows-latest, or windows-ui for a self-hosted machine)
        default: ''
      pages:
        description: Comma-separated page ids (empty crawls the whole catalog)
        default: ''
      configs:
        description: Comma-separated <theme>-<size> configurations
        default: light-expanded,dark-expanded,light-medium,dark-medium,light-compact,dark-compact
      mode:
        description: crawl, or platform-shots to capture the "Same code, every platform" images
        default: crawl
  push:
    # One branch per agent or person (jfversluis-maui-gallery-build-windows-<name>), so runs don't cancel each other.
    branches: [jfversluis-maui-gallery-build-windows, 'jfversluis-maui-gallery-build-windows-*']
    paths:
      - src/MauiGallery/**
      - .github/workflows/windows-ui.yml
      - .github/scripts/windows-ui-crawl.ps1
      - eng/platform-shots/**

permissions:
  contents: read

concurrency:
  group: windows-ui-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  APP_PROJECT: src/MauiGallery/MauiGallery.csproj
  WINDOWS_TFM: net11.0-windows10.0.19041.0
  MAUI_CLI_VERSION: 0.1.0-preview.14.26555.2
  OUT_DIR: ${{ github.workspace }}/windows-ui
  # Defaults for push runs; manual runs set them in the run dialog.
  CRAWL_PAGES: ''
  CRAWL_CONFIGS: light-expanded,dark-expanded,light-medium,dark-medium,light-compact,dark-compact
  CRAWL_MODE: ${{ (inputs.mode == 'platform-shots' || contains(github.event.head_commit.message, '[platform-shots]')) && 'PlatformShots' || 'Crawl' }}

jobs:
  crawl:
    name: Crawl (${{ inputs.runner || vars.WINDOWS_UI_RUNNER || 'windows-latest' }})
    runs-on: ${{ inputs.runner || vars.WINDOWS_UI_RUNNER || 'windows-latest' }}
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: dotnet workload install maui

      - name: Install the maui CLI
        run: |
          dotnet tool update --global Microsoft.Maui.Cli --version $env:MAUI_CLI_VERSION
          if ($LASTEXITCODE -ne 0) { dotnet tool update --global Microsoft.Maui.Cli --prerelease }
          maui --version

      - name: Build (Debug, unpackaged)
        run: |
          New-Item -ItemType Directory -Force -Path $env:OUT_DIR | Out-Null
          dotnet build $env:APP_PROJECT -f $env:WINDOWS_TFM -c Debug -p:WindowsAppSDKSelfContained=true -bl:"$env:OUT_DIR/build.binlog"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem "src/MauiGallery/bin/Debug/$env:WINDOWS_TFM" -Recurse -Filter MauiGallery.exe | Select-Object -First 1
          if (-not $exe) { throw 'MauiGallery.exe not found' }
          "APP_PATH=$($exe.FullName)" >> $env:GITHUB_ENV
          Write-Host "App: $($exe.FullName)"

      # Hosted runners start at 1024x768, too small for the expanded (1440) window. Fail-soft: a self-hosted desktop
      # may not allow it, and the crawl still runs.
      - name: Set the display resolution
        continue-on-error: true
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class Display
          {
              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              public struct DEVMODE
              {
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
                  public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
                  public int dmFields, dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
                  public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
                  public short dmLogPixels;
                  public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
                  public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2;
                  public int dmPanningWidth, dmPanningHeight;
              }
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern bool EnumDisplaySettings(string device, int mode, ref DEVMODE devMode);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int ChangeDisplaySettings(ref DEVMODE devMode, int flags);
              public static int Set(int width, int height)
              {
                  var mode = new DEVMODE();
                  mode.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
                  EnumDisplaySettings(null, -1, ref mode);
                  mode.dmPelsWidth = width;
                  mode.dmPelsHeight = height;
                  mode.dmFields = 0x80000 | 0x100000;
                  return ChangeDisplaySettings(ref mode, 0);
              }
          }
          '@
          $result = [Display]::Set(1920, 1080)
          Write-Host "ChangeDisplaySettings: $result (0 = changed)"
          if ($result -ne 0 -and (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue)) {
              Set-DisplayResolution -Width 1920 -Height 1080 -Force
          }

      # Mica needs transparency effects, which hosted runners have turned off; without them it falls back to a solid
      # color.
      - name: Turn on transparency effects
        continue-on-error: true
        run: |
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name EnableTransparency -Value 1 -Type DWord

      - name: Start the DevFlow broker
        run: |
          maui devflow broker start
          maui devflow broker status

      - name: Crawl the catalog
        run: |
          ./.github/scripts/windows-ui-crawl.ps1 -AppPath $env:APP_PATH -OutDir $env:OUT_DIR -Mode $env:CRAWL_MODE `
            -Pages '${{ inputs.pages || env.CRAWL_PAGES }}' -Configs '${{ inputs.configs || env.CRAWL_CONFIGS }}'
          Get-Content "$env:OUT_DIR/summary.md" >> $env:GITHUB_STEP_SUMMARY

      # Trims, scales and optimizes the captures, then collects them under platform-shots/normalized, laid out like
      # src/MauiGallery/Resources/Raw/platform-shots, so they can be copied straight into the repository.
      - name: Normalize the platform shots
        if: env.CRAWL_MODE == 'PlatformShots'
        run: |
          python -m pip install --quiet pillow
          python eng/platform-shots/normalize.py --raw "$env:OUT_DIR/platform-shots/raw" --platforms windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $target = Join-Path $env:OUT_DIR 'platform-shots/normalized'
          Get-ChildItem src/MauiGallery/Resources/Raw/platform-shots -Recurse -Filter 'windows-*.png' | ForEach-Object {
              $dir = Join-Path $target $_.Directory.Name
              New-Item -ItemType Directory -Force -Path $dir | Out-Null
              Copy-Item $_.FullName $dir
          }

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: warn
          retention-days: 14

  # The store pipeline on Windows: publishes the Release build unpackaged and checks that it starts and keeps running,
  # then publishes the Release MSIX with the same arguments as release.yml. Runs next to the Debug crawl.
  release:
    name: Release publish and smoke test
    if: inputs.mode != 'platform-shots' && !contains(github.event.head_commit.message, '[platform-shots]')
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_DIR: ${{ github.workspace }}/windows-release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: dotnet workload install maui

      # An unsigned MSIX can't be installed here, so the smoke test runs the same Release build unpackaged.
      - name: Publish unpackaged
        run: |
          dotnet publish $env:APP_PROJECT -f $env:WINDOWS_TFM -c Release -p:RuntimeIdentifier=win-x64 `
            -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem "src/MauiGallery/bin/Release/$env:WINDOWS_TFM/win-x64/publish" -Filter MauiGallery.exe | Select-Object -First 1
          if (-not $exe) { throw 'MauiGallery.exe not found' }
          "APP_PATH=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Start the app and keep it running for 20 seconds
        run: |
          New-Item -ItemType Directory -Force -Path $env:RELEASE_DIR | Out-Null
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $app = Start-Process -FilePath $env:APP_PATH -PassThru
          while (-not $app.HasExited -and $app.MainWindowHandle -eq 0 -and $sw.Elapsed.TotalSeconds -lt 60) {
              Start-Sleep -Milliseconds 100
              $app.Refresh()
          }
          $window = [int]$sw.Elapsed.TotalMilliseconds
          Start-Sleep -Seconds 20
          $app.Refresh()
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save("$env:RELEASE_DIR/release-smoke.png")
          if ($app.HasExited) {
              "- :x: The Release app exited with code $($app.ExitCode)" >> $env:GITHUB_STEP_SUMMARY
              Get-WinEvent -LogName Application -MaxEvents 30 -ErrorAction SilentlyContinue |
                  Where-Object { $_.LevelDisplayName -eq 'Error' } |
                  Format-List TimeCreated, ProviderName, Message | Out-File "$env:RELEASE_DIR/events.txt"
              exit 1
          }
          "- Release app: main window after $window ms, still running after 20 s" >> $env:GITHUB_STEP_SUMMARY
          Stop-Process -Id $app.Id

      - name: Publish the MSIX (as release.yml)
        run: |
          # Packaged and unpackaged builds share bin/ and obj/; start from a clean tree.
          Remove-Item -Recurse -Force src/MauiGallery/bin/Release, src/MauiGallery/obj/Release -ErrorAction SilentlyContinue
          $sw = [Diagnostics.Stopwatch]::StartNew()
          dotnet publish $env:APP_PROJECT -f $env:WINDOWS_TFM -c Release -p:RuntimeIdentifier=win-x64 `
            -p:WindowsPackageType=MSIX -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false `
            -p:AppxPackageDir="$env:RELEASE_DIR/msix/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msix = Get-ChildItem "$env:RELEASE_DIR/msix" -Recurse -Filter 'MauiGallery_*.msix' | Select-Object -First 1
          if (-not $msix) { throw 'No MSIX was produced' }
          "### Release MSIX`n- $($msix.Name): $([math]::Round($msix.Length / 1MB, 1)) MB, built in $([int]$sw.Elapsed.TotalSeconds) s" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ env.RELEASE_DIR }}/*.png
            ${{ env.RELEASE_DIR }}/*.txt
          if-no-files-found: warn
          retention-days: 14
